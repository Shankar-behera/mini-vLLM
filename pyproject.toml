[project]
name = "mini-vllm"
version = "0.1.0"
description = "A minimal PagedAttention-style KV cache and continuous batching scheduler simulator"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-asyncio>=0.23", "matplotlib>=3.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
